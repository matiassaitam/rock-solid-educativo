[package]
name = "rock-solid"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = "0.8"
bcrypt = "0.19"
dotenvy = "0.15"
jsonwebtoken = { version = "12.0", features = ["rust_crypto"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1.29", features = ["v4"] }
